name: movie_discovery
description: "A movie discovery app powered by the TMDB API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # Material Design widgets. In Flutter 3.47+ these live in this package;
  # `package:flutter/material.dart` is deprecated.
  material_ui: ^1.11.1
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # Networking + images
  http: ^1.6.0
  cached_network_image: ^4.0.7

  # Local persistence (favorites, theme mode)
  shared_preferences: ^2.5.6

  # Declarative navigation
  go_router: ^18.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
